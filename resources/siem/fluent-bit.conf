# Fluent Bit: forward COI audit JSONL + OS logs to a SIEM / the panel (P5).
#
# Install: copy to /etc/fluent-bit/fluent-bit.conf and set the SIEM env vars,
# then `sudo systemctl restart fluent-bit`.

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name         tail
    Path         /home/*/.coi/audit/*.jsonl
    Tag          fleet.coi.audit
    Parser       docker
    DB           /var/lib/fluent-bit/fleet-coi.db
    Refresh_Interval 5

[INPUT]
    Name         tail
    Path         /var/log/auth.log,/var/log/audit/audit.log
    Tag          fleet.os.audit
    DB           /var/lib/fluent-bit/fleet-os.db

[FILTER]
    Name         record_modifier
    Match        fleet.*
    Record       agent_pool linux-coi

# Ship to Elasticsearch:
[OUTPUT]
    Name         es
    Match        fleet.*
    Host         ${FLEET_SIEM_HOST}
    Port         9200
    HTTP_User    ${FLEET_SIEM_USER}
    HTTP_Passwd  ${FLEET_SIEM_PASSWORD}
    Index        fleet-audit
    tls          On
    tls.verify   On

# Or forward to the panel ingest API as audit events:
# [OUTPUT]
#     Name        http
#     Match       fleet.coi.audit
#     Host        panel.internal
#     Port        443
#     URI         /api/ingest
#     Format      json
#     Header      Authorization Bearer ${FLEET_INGEST_TOKEN}
#     tls         On
