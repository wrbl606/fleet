# PF egress allowlist for the macOS bare-metal agent host (plan §8, P4).
#
# Installed by scripts/hardening/macos.sh to /etc/pf.anchors/fleet-egress.
# The <fleet_egress> table is populated with the resolved LLM + package
# registry addresses and refreshed periodically, so the agent can reach only
# those destinations even if the Seatbelt profile is relaxed.

table <fleet_egress> persist

# DNS must be allowed for the refresh job to resolve the table (it runs as
# root, outside the agent's UID; a UID-scoped rule would be tighter).
pass out quick proto {tcp, udp} to any port 53

# Default: drop agent egress to anything not in the allowlist.
block drop out quick proto tcp to any port {80, 443} !<fleet_egress>

# Allow everything else out (loopback, established) — PF's stateful filter
# keeps this cheap; tighten further if the host has other tenants.
pass out quick all
